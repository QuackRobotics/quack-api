openapi: 3.1.0
info:
  title: Micro Duck API
  version: 0.1.0
  description: >-
    REST surface of quack-api. This file is the source of truth: SDKs are
    generated from it, and the server in quack-api/ implements it.

    Telemetry is a WebSocket at ws://localhost:8081/telemetry: one JSON
    TelemetryFrame (see components) per tick at 50 Hz. On a hardware error
    the server closes the socket with code 1011 and reason
    hardware_unavailable. The gRPC control service on :50051 is defined in
    quack-proto/proto/quack/control/v1/control.proto.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: http://localhost:8080
    description: Local development (mock hardware)
tags:
  - name: system
  - name: state
paths:
  /health:
    get:
      operationId: getHealth
      tags: [system]
      summary: Liveness check
      responses:
        "200":
          description: The server is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /info:
    get:
      operationId: getInfo
      tags: [system]
      summary: Server and API versions
      responses:
        "200":
          description: Version information.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Info"
  /state:
    get:
      operationId: getState
      tags: [state]
      summary: Current state of every joint
      responses:
        "200":
          description: Joint states.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RobotState"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
    post:
      operationId: moveJoints
      tags: [state]
      summary: Move joints and wait until the move has finished
      description: >-
        Synchronous move. All targets are validated before anything moves;
        on any error nothing moves. Returns the state after the move.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoveRequest"
      responses:
        "200":
          description: Joint states after the move.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RobotState"
        "400":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
components:
  responses:
    Error:
      description: >-
        400 invalid_body (malformed JSON or missing fields), 422 invalid_move
        (empty, unknown or duplicate joint, non-finite position), 500
        invalid_hardware_state, 503 hardware_unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok
    Info:
      type: object
      required: [name, version, api_version]
      properties:
        name:
          type: string
          examples: [quack-api]
        version:
          type: string
          description: Server build version.
        api_version:
          type: string
          description: Version of this contract (info.version).
    JointState:
      type: object
      required:
        - name
        - servo_id
        - has_feedback
        - position_rad
        - velocity_rad_s
        - current_ma
        - temperature_c
      properties:
        name:
          type: string
          examples: [left_knee]
        servo_id:
          type: integer
          format: uint32
          description: Bus servo id 1..14, or 255 for a joint that is not on the bus.
          # Each branch repeats the type, and 255 is enum not const: with const,
          # openapi-python-client 0.28 rejects every bus id 1..14.
          oneOf:
            - type: integer
              minimum: 1
              maximum: 14
            - type: integer
              enum: [255]
        has_feedback:
          type: boolean
          description: False for joints without feedback; their feedback fields are null.
        position_rad:
          type: number
          format: float
        velocity_rad_s:
          type: [number, "null"]
          format: float
        current_ma:
          type: [number, "null"]
          format: float
        temperature_c:
          type: [number, "null"]
          format: float
    RobotState:
      type: object
      required: [joints]
      properties:
        joints:
          type: array
          items:
            $ref: "#/components/schemas/JointState"
    JointTarget:
      type: object
      required: [name, position_rad]
      properties:
        name:
          type: string
        position_rad:
          type: number
          format: float
    MoveRequest:
      type: object
      required: [joints]
      properties:
        joints:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/JointTarget"
    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - invalid_body
            - invalid_move
            - invalid_hardware_state
            - hardware_unavailable
        message:
          type: string
    TelemetryFrame:
      description: >-
        One WebSocket message on ws://localhost:8081/telemetry. Mirrors
        quack.telemetry.v1.JointStates.
      type: object
      required: [timestamp_us, joints]
      properties:
        timestamp_us:
          type: integer
          format: uint64
          description: Microseconds since the Unix epoch when the joints were read.
        joints:
          type: array
          items:
            $ref: "#/components/schemas/JointState"
