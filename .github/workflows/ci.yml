name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - run: buf lint quack-proto
      - name: buf breaking against main
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin main:refs/heads/main
          scripts/buf-breaking.sh

  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pipx run openapi-spec-validator==0.7.1 openapi/quack-api.yaml

  ci:
    needs: [rust, proto, openapi]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: all required jobs passed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "rust=${{ needs.rust.result }} proto=${{ needs.proto.result }} openapi=${{ needs.openapi.result }}"
          exit 1
      - run: echo "rust=${{ needs.rust.result }} proto=${{ needs.proto.result }} openapi=${{ needs.openapi.result }}"
