name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - run: buf lint quack-proto
      - name: buf breaking against main
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin main:refs/heads/main
          scripts/buf-breaking.sh

  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pipx run openapi-spec-validator==0.7.1 openapi/quack-api.yaml

  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "26.13.1"
      - run: quack-sdk-gen/gen-python.sh
      - run: quack-sdk-gen/gen-typescript.sh
      - run: quack-sdk-gen/test-python.sh
      - run: quack-sdk-gen/test-typescript.sh

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26.13.1"
      - run: quack-sdk-gen/gen-typescript.sh
      - run: npm ci --no-audit --no-fund
        working-directory: quack-dashboard
      - run: npm test
        working-directory: quack-dashboard
      - run: npm run build
        working-directory: quack-dashboard

  ci:
    needs: [rust, proto, openapi, sdk, dashboard]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: all required jobs passed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "rust=${{ needs.rust.result }} proto=${{ needs.proto.result }} openapi=${{ needs.openapi.result }} sdk=${{ needs.sdk.result }} dashboard=${{ needs.dashboard.result }}"
          exit 1
      - run: echo "rust=${{ needs.rust.result }} proto=${{ needs.proto.result }} openapi=${{ needs.openapi.result }} sdk=${{ needs.sdk.result }} dashboard=${{ needs.dashboard.result }}"
